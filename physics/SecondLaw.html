<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newton's Second Law - F=ma Lab</title>
    <!-- Three.js for 3D Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Tailwind CSS for UI Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #020617; 
            color: white; 
            user-select: none;
        }
        #canvas-container { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
        }
        .ui-overlay { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            z-index: 10; 
            pointer-events: none; 
        }
        .controls { 
            position: absolute; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 10; 
            width: 90%; 
            max-width: 500px; 
        }
        .glass { 
            background: rgba(15, 23, 42, 0.75); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 20px; 
            pointer-events: auto; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        input[type=range] { 
            width: 100%; 
            height: 6px; 
            background: #1e293b; 
            border-radius: 4px; 
            appearance: none; 
            cursor: pointer; 
        }
        input[type=range]::-webkit-slider-thumb { 
            appearance: none; 
            width: 20px; 
            height: 20px; 
            background: #38bdf8; 
            border-radius: 50%; 
            cursor: pointer; 
            border: 3px solid #f8fafc;
        }
        .law-formula { 
            font-family: 'Times New Roman', serif;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- UI Overlay: Law Definition & Stats -->
    <div class="ui-overlay space-y-4 max-w-[280px] md:max-w-md">
        <div class="glass p-6">
            <h1 class="text-xl font-bold bg-gradient-to-r from-sky-400 to-indigo-500 bg-clip-text text-transparent">Newton's Second Law</h1>
            <p class="text-slate-400 text-[10px] mb-4 uppercase tracking-[0.2em]">Force, Mass, & Acceleration</p>
            
            <div class="law-formula text-4xl font-bold text-center py-4 border-y border-slate-700/50">
                <span class="text-green-400">F</span> = 
                <span class="text-pink-400">m</span>
                <span class="text-sky-400">a</span>
            </div>
            <p class="text-[10px] text-center text-slate-500 mt-2 uppercase">Acceleration is produced when a force acts on a mass.</p>
        </div>

        <div class="glass p-5 grid grid-cols-1 gap-3 text-sm">
            <div class="flex justify-between items-center">
                <span class="text-slate-400">Net Force (F):</span>
                <span id="f-val-display" class="font-bold text-green-400 text-lg">0 N</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-slate-400">Mass (m):</span>
                <span id="m-val-display" class="font-bold text-pink-400 text-lg">5.0 kg</span>
            </div>
            <div class="flex justify-between items-center border-t border-slate-700 pt-3">
                <span class="text-slate-400">Acceleration (a):</span>
                <span id="a-val-display" class="font-bold text-sky-400 text-xl">0.00 m/s²</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-slate-400">Velocity (v):</span>
                <span id="v-val-display" class="font-bold text-white text-lg">0.0 m/s</span>
            </div>
        </div>
    </div>

    <!-- Bottom Controls Panel -->
    <div class="controls glass p-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-3">
                <div class="flex justify-between text-[10px] font-bold uppercase tracking-wider text-slate-400">
                    <span>Applied Force (N)</span>
                    <span class="text-green-400" id="force-label">0 N</span>
                </div>
                <input type="range" id="force-slider" min="-20" max="20" step="1" value="0">
            </div>
            
            <div class="space-y-3">
                <div class="flex justify-between text-[10px] font-bold uppercase tracking-wider text-slate-400">
                    <span>Object Mass (kg)</span>
                    <span class="text-pink-400" id="mass-label">5 kg</span>
                </div>
                <input type="range" id="mass-slider" min="1" max="20" step="0.5" value="5">
            </div>
        </div>
        
        <div class="flex gap-4">
            <button id="reset-btn" class="w-full border border-slate-600 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition-all uppercase text-xs">Reset Experiment</button>
        </div>

        <div class="flex justify-between items-center">
            <p class="text-[9px] text-slate-500 uppercase tracking-widest">Frictionless Environment</p>
            <div class="flex gap-2">
                <div class="w-3 h-3 bg-sky-400 rounded-full animate-pulse"></div>
                <span class="text-[9px] text-slate-400 uppercase">Vector Tracking Active</span>
            </div>
        </div>
    </div>

    <script>
        /**
         * PHYSICS STATE
         */
        let force = 0;
        let mass = 5.0;
        let acceleration = 0;
        let velocity = 0;
        let position = 0;
        
        const WORLD_LIMIT = 30;

        /**
         * THREE.JS SETUP
         */
        let scene, camera, renderer, object, forceArrow, velocityArrow;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 6, 18);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            addLighting();
            createEnvironment();
            createTestObject();
            
            animate();
        }

        function addLighting() {
            const ambient = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambient);

            const spot = new THREE.SpotLight(0xffffff, 1);
            spot.position.set(0, 10, 10);
            scene.add(spot);
            
            const point = new THREE.PointLight(0x38bdf8, 1, 30);
            point.position.set(0, 3, 5);
            scene.add(point);
        }

        function createEnvironment() {
            const floorGeo = new THREE.PlaneGeometry(200, 30);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x0f172a,
                metalness: 0.7,
                roughness: 0.3
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -1;
            scene.add(floor);

            const grid = new THREE.GridHelper(200, 100, 0x1e293b, 0x0f172a);
            grid.position.y = -0.99;
            scene.add(grid);
        }

        function createTestObject() {
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material = new THREE.MeshPhongMaterial({ 
                color: 0xec4899,
                transparent: true,
                opacity: 0.9,
                shininess: 80
            });
            object = new THREE.Mesh(geometry, material);
            scene.add(object);

            // Force Vector (Green)
            forceArrow = new THREE.ArrowHelper(
                new THREE.Vector3(1, 0, 0),
                new THREE.Vector3(0, 0, 0),
                0, 0x4ade80, 0.6, 0.4
            );
            scene.add(forceArrow);

            // Velocity Vector (Blue)
            velocityArrow = new THREE.ArrowHelper(
                new THREE.Vector3(1, 0, 0),
                new THREE.Vector3(0, 0, 0),
                0, 0x38bdf8, 0.4, 0.2
            );
            scene.add(velocityArrow);
        }

        /**
         * ANIMATION & PHYSICS LOOP
         */
        function animate() {
            requestAnimationFrame(animate);

            // Newton's Second Law: a = F / m
            acceleration = force / mass;
            
            // v = v0 + a*t
            velocity += acceleration * 0.016; // Assuming 60fps (dt = 1/60)
            
            // s = s0 + v*t
            position += velocity * 0.016;

            // Wrap around world
            if (position > WORLD_LIMIT) position = -WORLD_LIMIT;
            if (position < -WORLD_LIMIT) position = WORLD_LIMIT;

            // Update 3D Object
            object.position.x = position;
            const scale = 0.5 + (mass / 20) * 1.5;
            object.scale.set(scale, scale, scale);
            object.position.y = (scale * 2) / 2 - 1;

            // Update Vectors
            forceArrow.position.set(position, 2.5, 0);
            const fDir = force >= 0 ? 1 : -1;
            forceArrow.setDirection(new THREE.Vector3(fDir, 0, 0));
            forceArrow.setLength(Math.abs(force) * 0.2, 0.6, 0.3);
            forceArrow.visible = Math.abs(force) > 0.1;

            velocityArrow.position.set(position, 1.5, 0);
            const vDir = velocity >= 0 ? 1 : -1;
            velocityArrow.setDirection(new THREE.Vector3(vDir, 0, 0));
            velocityArrow.setLength(Math.abs(velocity) * 0.3, 0.4, 0.2);
            velocityArrow.visible = Math.abs(velocity) > 0.1;

            // UI Update
            document.getElementById('f-val-display').innerText = force + ' N';
            document.getElementById('m-val-display').innerText = mass.toFixed(1) + ' kg';
            document.getElementById('a-val-display').innerText = acceleration.toFixed(2) + ' m/s²';
            document.getElementById('v-val-display').innerText = velocity.toFixed(1) + ' m/s';

            renderer.render(scene, camera);
        }

        /**
         * CONTROLS
         */
        document.getElementById('force-slider').addEventListener('input', (e) => {
            force = parseFloat(e.target.value);
            document.getElementById('force-label').innerText = force + ' N';
        });

        document.getElementById('mass-slider').addEventListener('input', (e) => {
            mass = parseFloat(e.target.value);
            document.getElementById('mass-label').innerText = mass.toFixed(0) + ' kg';
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            force = 0;
            velocity = 0;
            position = 0;
            document.getElementById('force-slider').value = 0;
            document.getElementById('force-label').innerText = '0 N';
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = init;
    </script>
</body>
</html>
