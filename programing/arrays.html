<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Architect Pro | 3D Sorting Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #10b981; --bg: #020617; }
        body { margin: 0; background-color: var(--bg); color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
        .ui-panel { position: fixed; top: 50%; left: 30px; transform: translateY(-50%); width: 380px; z-index: 100; max-height: 90vh; }
        .sort-card { transition: all 0.2s ease; cursor: pointer; border-left: 4px solid transparent; }
        .sort-card:hover { background: rgba(16, 185, 129, 0.1); transform: translateX(8px); }
        .sort-card.active { background: rgba(16, 185, 129, 0.2); border-left-color: var(--accent); }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        input[type="range"] { accent-color: var(--accent); }
    </style>
</head>
<body>

    <canvas id="canvas-bg" class="fixed top-0 left-0 w-full h-full"></canvas>

    <div class="ui-panel glass p-6 rounded-[2.5rem] shadow-2xl flex flex-col gap-5 overflow-y-auto custom-scroll">
        <header>
            <div class="flex items-center gap-3 mb-1">
                <div class="bg-emerald-500 w-8 h-8 rounded-lg flex items-center justify-center font-bold text-white text-sm">[]</div>
                <h1 class="text-xl font-black tracking-tighter uppercase">Array<span class="text-emerald-500">Lab</span></h1>
            </div>
            <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">Advanced 3D Sorting Suite</p>
        </header>

        <div class="space-y-4">
            <div>
                <label class="text-[10px] font-extrabold text-slate-500 uppercase mb-2 block">Custom Data</label>
                <input type="text" id="custom-input" placeholder="e.g. 15, 8, 22, 4, 11" 
                       class="w-full bg-slate-950 border border-white/5 rounded-xl px-4 py-3 text-sm font-mono focus:outline-none focus:border-emerald-500/50 transition">
                <div class="flex gap-2 mt-2">
                    <button onclick="applyInput()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-2 rounded-lg text-[10px] font-black uppercase transition">Apply</button>
                    <button onclick="randomize()" class="flex-1 bg-slate-800 hover:bg-slate-700 py-2 rounded-lg text-[10px] font-black uppercase transition">Random</button>
                </div>
            </div>

            <div>
                <div class="flex justify-between text-[10px] font-black uppercase text-slate-500 mb-2">
                    <span>Speed Delay</span>
                    <span id="speed-label" class="text-emerald-500">100ms</span>
                </div>
                <input type="range" id="speed-range" min="10" max="600" value="100" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer">
            </div>
        </div>

        <div class="h-px bg-white/5"></div>

        <div class="grid grid-cols-1 gap-2" id="algo-list">
            <button onclick="execute('bubble')" id="btn-bubble" class="sort-card p-3 rounded-xl glass text-left text-xs font-bold uppercase">Bubble Sort</button>
            <button onclick="execute('selection')" id="btn-selection" class="sort-card p-3 rounded-xl glass text-left text-xs font-bold uppercase">Selection Sort</button>
            <button onclick="execute('insertion')" id="btn-insertion" class="sort-card p-3 rounded-xl glass text-left text-xs font-bold uppercase">Insertion Sort</button>
            <button onclick="execute('shell')" id="btn-shell" class="sort-card p-3 rounded-xl glass text-left text-xs font-bold uppercase">Shell Sort</button>
            <button onclick="execute('heap')" id="btn-heap" class="sort-card p-3 rounded-xl glass text-left text-xs font-bold uppercase">Heap Sort</button>
            <button onclick="execute('quick')" id="btn-quick" class="sort-card p-3 rounded-xl glass text-left text-xs font-bold uppercase text-emerald-400">Quick Sort (Fast)</button>
            <button onclick="execute('merge')" id="btn-merge" class="sort-card p-3 rounded-xl glass text-left text-xs font-bold uppercase text-emerald-400">Merge Sort (Stable)</button>
        </div>
    </div>

    <div class="fixed bottom-10 right-10 text-right pointer-events-none">
        <div id="algo-name" class="text-7xl font-black text-emerald-500 opacity-10 italic uppercase">Idle</div>
        <div id="algo-step" class="text-xs font-bold text-slate-500 tracking-[0.3em] uppercase mt-2">Waiting for input...</div>
    </div>

    <script>
        let scene, camera, renderer, arrayBars = [], arrayValues = [];
        let isSorting = false;
        let speed = 100;

        // 1. SETUP ENGINE
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(18, 15, 25);
            camera.lookAt(0, 5, 0);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas-bg'), antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const pLight = new THREE.PointLight(0x10b981, 1.5, 100);
            pLight.position.set(10, 20, 10);
            scene.add(pLight);

            const grid = new THREE.GridHelper(100, 50, 0x1e293b, 0x0f172a);
            scene.add(grid);

            randomize();
            animate();
        }

        // 2. DATA MANAGEMENT
        function randomize() {
            if(isSorting) return;
            const data = Array.from({length: 14}, () => Math.floor(Math.random() * 15) + 3);
            renderBars(data);
        }

        function applyInput() {
            if(isSorting) return;
            const val = document.getElementById('custom-input').value;
            const data = val.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n) && n > 0);
            if(data.length > 0) renderBars(data);
        }

        function renderBars(data) {
            arrayBars.forEach(b => scene.remove(b));
            arrayBars = [];
            arrayValues = [...data];
            const spacing = 2.4;
            const offset = (data.length * spacing) / 2;

            data.forEach((val, i) => {
                const geo = new THREE.BoxGeometry(1.6, val, 1.6);
                const mat = new THREE.MeshPhongMaterial({ color: 0x334155, shininess: 80 });
                const bar = new THREE.Mesh(geo, mat);
                bar.position.set((i * spacing) - offset, val / 2, 0);
                scene.add(bar);
                arrayBars.push(bar);
            });
        }

        // 3. SORTING UTILITIES
        const sleep = (ms) => new Promise(r => setTimeout(r, ms));
        
        function setBarColor(i, color = 0x334155) {
            if(arrayBars[i]) arrayBars[i].material.color.setHex(color);
        }

        async function swap(i, j) {
            setBarColor(i, 0xef4444); setBarColor(j, 0xef4444);
            const x1 = arrayBars[i].position.x;
            const x2 = arrayBars[j].position.x;
            
            await new Promise(res => {
                new TWEEN.Tween(arrayBars[i].position).to({ x: x2 }, speed).start();
                new TWEEN.Tween(arrayBars[j].position).to({ x: x1 }, speed).onComplete(res).start();
            });

            [arrayBars[i], arrayBars[j]] = [arrayBars[j], arrayBars[i]];
            [arrayValues[i], arrayValues[j]] = [arrayValues[j], arrayValues[i]];
            setBarColor(i); setBarColor(j);
        }

        // 4. THE ALGORITHMS
        const algos = {
            bubble: async () => {
                for (let i = 0; i < arrayValues.length; i++) {
                    for (let j = 0; j < arrayValues.length - i - 1; j++) {
                        setBarColor(j, 0xfbbf24); setBarColor(j+1, 0xfbbf24);
                        await sleep(speed);
                        if (arrayValues[j] > arrayValues[j+1]) await swap(j, j+1);
                        setBarColor(j); setBarColor(j+1);
                    }
                    setBarColor(arrayValues.length - 1 - i, 0x10b981);
                }
            },
            selection: async () => {
                for (let i = 0; i < arrayValues.length; i++) {
                    let min = i;
                    setBarColor(i, 0x3b82f6);
                    for (let j = i + 1; j < arrayValues.length; j++) {
                        setBarColor(j, 0xfbbf24); await sleep(speed/2);
                        if (arrayValues[j] < arrayValues[min]) {
                            if(min !== i) setBarColor(min);
                            min = j; setBarColor(min, 0xef4444);
                        } else setBarColor(j);
                    }
                    await swap(i, min);
                    setBarColor(i, 0x10b981);
                }
            },
            insertion: async () => {
                setBarColor(0, 0x10b981);
                for (let i = 1; i < arrayValues.length; i++) {
                    let j = i;
                    while (j > 0 && arrayValues[j] < arrayValues[j - 1]) {
                        await swap(j, j - 1);
                        j--;
                    }
                    for(let k=0; k<=i; k++) setBarColor(k, 0x10b981);
                }
            },
            shell: async () => {
                let n = arrayValues.length;
                for (let gap = Math.floor(n/2); gap > 0; gap = Math.floor(gap/2)) {
                    for (let i = gap; i < n; i++) {
                        let j = i;
                        while (j >= gap && arrayValues[j] < arrayValues[j - gap]) {
                            await swap(j, j - gap);
                            j -= gap;
                        }
                    }
                }
            },
            heap: async () => {
                let n = arrayValues.length;
                const heapify = async (size, i) => {
                    let largest = i, l = 2*i+1, r = 2*i+2;
                    if (l < size && arrayValues[l] > arrayValues[largest]) largest = l;
                    if (r < size && arrayValues[r] > arrayValues[largest]) largest = r;
                    if (largest !== i) {
                        await swap(i, largest);
                        await heapify(size, largest);
                    }
                };
                for (let i = Math.floor(n/2)-1; i >= 0; i--) await heapify(n, i);
                for (let i = n-1; i > 0; i--) {
                    await swap(0, i);
                    setBarColor(i, 0x10b981);
                    await heapify(i, 0);
                }
                setBarColor(0, 0x10b981);
            },
            quick: async (l = 0, r = arrayValues.length - 1) => {
                if (l >= r) { if(l >= 0) setBarColor(l, 0x10b981); return; }
                let pivot = arrayValues[r];
                setBarColor(r, 0x6366f1);
                let i = l;
                for (let j = l; j < r; j++) {
                    setBarColor(j, 0xfbbf24); await sleep(speed/2);
                    if (arrayValues[j] < pivot) {
                        await swap(i, j);
                        i++;
                    }
                    setBarColor(j);
                }
                await swap(i, r);
                setBarColor(i, 0x10b981);
                await Promise.all([algos.quick(l, i - 1), algos.quick(i + 1, r)]);
            },
            merge: async (l = 0, r = arrayValues.length - 1) => {
                if (l >= r) return;
                const m = Math.floor((l + r) / 2);
                await algos.merge(l, m);
                await algos.merge(m + 1, r);
                
                let leftArr = arrayValues.slice(l, m + 1);
                let rightArr = arrayValues.slice(m + 1, r + 1);
                let i = 0, j = 0, k = l;

                while (i < leftArr.length && j < rightArr.length) {
                    setBarColor(k, 0xec4899);
                    if (leftArr[i] <= rightArr[j]) {
                        arrayValues[k] = leftArr[i]; i++;
                    } else {
                        arrayValues[k] = rightArr[j]; j++;
                    }
                    // Visual height update for Merge Sort
                    const val = arrayValues[k];
                    arrayBars[k].geometry.dispose();
                    arrayBars[k].geometry = new THREE.BoxGeometry(1.6, val, 1.6);
                    arrayBars[k].position.y = val / 2;
                    await sleep(speed);
                    setBarColor(k);
                    k++;
                }
                while (i < leftArr.length) { 
                    arrayValues[k] = leftArr[i]; 
                    const val = arrayValues[k];
                    arrayBars[k].geometry.dispose();
                    arrayBars[k].geometry = new THREE.BoxGeometry(1.6, val, 1.6);
                    arrayBars[k].position.y = val / 2;
                    i++; k++; await sleep(speed); 
                }
                while (j < rightArr.length) { 
                    arrayValues[k] = rightArr[j]; 
                    const val = arrayValues[k];
                    arrayBars[k].geometry.dispose();
                    arrayBars[k].geometry = new THREE.BoxGeometry(1.6, val, 1.6);
                    arrayBars[k].position.y = val / 2;
                    j++; k++; await sleep(speed); 
                }
                for(let x=l; x<=r; x++) setBarColor(x, 0x10b981);
            }
        };

        // 5. EXECUTION
        async function execute(type) {
            if (isSorting) return;
            isSorting = true;
            document.querySelectorAll('.sort-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`btn-${type}`).classList.add('active');
            
            document.getElementById('algo-name').innerText = type;
            document.getElementById('algo-step').innerText = "Algorithm Running...";
            
            // Reset colors
            arrayBars.forEach((_, i) => setBarColor(i));
            
            await algos[type]();
            
            isSorting = false;
            document.getElementById('algo-step').innerText = "Task Finished.";
        }

        // 6. ENGINE START
        document.getElementById('speed-range').addEventListener('input', (e) => {
            speed = parseInt(e.target.value);
            document.getElementById('speed-label').innerText = speed + 'ms';
        });

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
