<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Loop | Dynamic Universe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #60a5fa; --bg: #030712; }
        body { margin: 0; background-color: var(--bg); color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 0; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .ui-panel { position: fixed; top: 50%; left: 3rem; transform: translateY(-50%); width: 400px; z-index: 100; border-radius: 2rem; padding: 2.5rem; }
        .loop-card { cursor: pointer; transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.05); }
        .loop-card:hover { background: rgba(255,255,255,0.05); transform: scale(1.02); border-color: var(--accent); }
        .active { border-color: var(--accent); background: rgba(96, 165, 250, 0.1); }
        .math-font { font-family: 'Fira Code', monospace; font-size: 11px; }
        #code-terminal { outline: none; min-height: 100px; color: #94a3b8; }
        @media (max-width: 768px) { .ui-panel { width: 90%; left: 5%; top: auto; bottom: 2rem; transform: none; } }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <nav class="fixed top-0 w-full z-[1000] glass px-8 py-4 flex justify-between items-center">
        <div>
            <h1 class="text-lg font-black tracking-tighter">INFINITY<span class="text-blue-500">LOOP</span></h1>
            <p class="text-[9px] uppercase tracking-widest text-slate-500">Kinetic Logic Engine</p>
        </div>
        <button onclick="resetScene()" class="px-5 py-2 glass hover:bg-white/10 rounded-full text-[10px] font-bold uppercase tracking-widest transition">Purge Matrix</button>
    </nav>

    <div class="ui-panel glass">
        <header class="mb-6">
            <h2 class="text-3xl font-extrabold tracking-tight mb-2">Universe Controller</h2>
            <p class="text-slate-400 text-xs">Select a logic module to generate kinetic geometry. Use your mouse to orbit the view.</p>
        </header>

        <div class="grid grid-cols-2 gap-3 mb-6">
            <div onclick="initLoop('for')" id="card-for" class="loop-card p-4 rounded-2xl glass">
                <span class="text-[9px] font-bold text-blue-400 uppercase">Linear</span>
                <h4 class="font-bold text-sm">For Loop</h4>
            </div>
            <div onclick="initLoop('while')" id="card-while" class="loop-card p-4 rounded-2xl glass">
                <span class="text-[9px] font-bold text-emerald-400 uppercase">Spiral</span>
                <h4 class="font-bold text-sm">While Loop</h4>
            </div>
            <div onclick="initLoop('recursion')" id="card-recursion" class="loop-card p-4 rounded-2xl glass">
                <span class="text-[9px] font-bold text-rose-400 uppercase">Fractal</span>
                <h4 class="font-bold text-sm">Recursion</h4>
            </div>
            <div onclick="initLoop('forEach')" id="card-forEach" class="loop-card p-4 rounded-2xl glass">
                <span class="text-[9px] font-bold text-amber-400 uppercase">Network</span>
                <h4 class="font-bold text-sm">ForEach</h4>
            </div>
        </div>

        <div class="bg-black/40 p-5 rounded-2xl border border-white/5 relative">
            <div class="absolute -top-2 left-4 px-2 py-0.5 bg-blue-600 rounded text-[8px] font-bold uppercase">Source Editor</div>
            <div id="code-terminal" contenteditable="true" spellcheck="false" class="math-font">
// Select a module or write here...
            </div>
            <button onclick="runCustomCode()" class="mt-4 w-full py-2 bg-blue-600 hover:bg-blue-500 rounded-xl text-[10px] font-bold uppercase transition">Execute Logic</button>
        </div>
    </div>

    <div class="fixed bottom-8 right-8 text-right pointer-events-none">
        <div id="status-val" class="text-7xl font-black opacity-10 leading-none">000</div>
        <div id="status-label" class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mt-2">System Idle</div>
    </div>

    <script>
        let scene, camera, renderer, clock, mainGroup, particles, grid;
        let spawnedItems = [];
        let isRunning = false;

        const SNIPPETS = {
            'for': `for (let i = 0; i < 20; i++) {
    const y = (i - 10) * 1.5;
    spawnObject(Math.cos(i)*5, y, Math.sin(i)*5, 0x60a5fa, 'box');
    await sleep(100);
}`,
            'while': `let i = 0;
while (i < 30) {
    const r = i * 0.5;
    spawnObject(Math.cos(i)*r, 0, Math.sin(i)*r, 0x34d399, 'sphere');
    i++; await sleep(80);
}`,
            'recursion': `async function tree(x, y, z, d) {
    if(d <= 0) return;
    spawnObject(x, y, z, 0xfb7185, 'octa');
    await sleep(200);
    await tree(x+d, y+2, z, d-1);
    await tree(x-d, y+2, z, d-1);
}
await tree(0, -8, 0, 4);`,
            'forEach': `[...Array(12)].forEach(async (_, i) => {
    const a = (i/12) * Math.PI * 2;
    spawnObject(Math.cos(a)*10, 0, Math.sin(a)*10, 0xfbbf24, 'torus');
    await sleep(100 * i);
});`
        };

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(20, 15, 20);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas-bg'), antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            clock = new THREE.Clock();
            mainGroup = new THREE.Group();
            scene.add(mainGroup);

            // Lights
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const pLight = new THREE.PointLight(0x60a5fa, 2, 100);
            pLight.position.set(10, 20, 10);
            scene.add(pLight);

            // Stars
            const starGeo = new THREE.BufferGeometry();
            const stars = [];
            for(let i=0; i<2000; i++) stars.push((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100);
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(stars, 3));
            particles = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x475569, size: 0.1 }));
            scene.add(particles);

            // Grid
            grid = new THREE.GridHelper(100, 50, 0x1e293b, 0x0f172a);
            grid.position.y = -10;
            scene.add(grid);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth/window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function spawnObject(x, y, z, color, type) {
            let geo;
            if(type === 'box') geo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            else if(type === 'sphere') geo = new THREE.IcosahedronGeometry(1, 2);
            else if(type === 'octa') geo = new THREE.OctahedronGeometry(1.2);
            else geo = new THREE.TorusGeometry(1, 0.3, 16, 32);

            const mat = new THREE.MeshStandardMaterial({ color, metalness: 0.7, roughness: 0.2, transparent: true, opacity: 0.9 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.scale.set(0,0,0);
            mainGroup.add(mesh);
            spawnedItems.push(mesh);

            new TWEEN.Tween(mesh.scale).to({x:1, y:1, z:1}, 1000).easing(TWEEN.Easing.Elastic.Out).start();
            return mesh;
        }

        async function initLoop(type) {
            if(isRunning) return;
            document.querySelectorAll('.loop-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`card-${type}`).classList.add('active');
            document.getElementById('code-terminal').innerText = SNIPPETS[type];
            await runCustomCode();
        }

        async function runCustomCode() {
            if(isRunning) return;
            isRunning = true;
            await clearScene();
            const code = document.getElementById('code-terminal').innerText;
            document.getElementById('status-label').innerText = "Running Logic...";
            
            try {
                const AsyncFn = Object.getPrototypeOf(async function(){}).constructor;
                const runner = new AsyncFn('spawnObject', 'sleep', 'updateStatus', code);
                await runner(spawnObject, (ms) => new Promise(res => setTimeout(res, ms)), updateStatus);
                document.getElementById('status-label').innerText = "Sequence Complete";
            } catch(e) { 
                document.getElementById('status-label').innerText = "Error: " + e.message;
            }
            isRunning = false;
        }

        async function clearScene() {
            const items = [...spawnedItems];
            spawnedItems = [];
            items.forEach(obj => {
                new TWEEN.Tween(obj.scale).to({x:0, y:0, z:0}, 500).onComplete(() => mainGroup.remove(obj)).start();
            });
            await new Promise(res => setTimeout(res, 500));
        }

        function updateStatus(val, label) {
            document.getElementById('status-val').innerText = val.toString().padStart(3, '0');
        }

        function resetScene() { if(!isRunning) clearScene(); }

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);
            const et = clock.getElapsedTime();

            // KINETIC ANIMATION ENGINE (The "Live" movement)
            particles.rotation.y = et * 0.05; // Stars move
            mainGroup.rotation.y += 0.003;    // Structure rotates
            
            // Pulse Effect
            const pulse = 1 + Math.sin(et * 0.5) * 0.05;
            mainGroup.scale.set(pulse, pulse, pulse);

            // Camera Sway
            camera.position.x = 20 + Math.sin(et * 0.3) * 5;
            camera.lookAt(0, 0, 0);

            spawnedItems.forEach((obj, i) => {
                obj.rotation.y += 0.01;
                obj.position.y += Math.sin(et + i) * 0.005; // Floating movement
            });

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
